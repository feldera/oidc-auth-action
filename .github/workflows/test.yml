name: Test

# Exercises the action end to end without a Feldera instance: it only talks to
# the runner's own token endpoint, so the job can mint a token and check what
# came back.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-auth:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default audience
            audience: ""
          - name: custom audience
            audience: feldera-oidc-auth-selftest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: ./
        with:
          audience: ${{ matrix.audience }}

      - name: The token file carries a JWT for the requested audience
        env:
          EXPECTED_AUDIENCE: ${{ matrix.audience }}
        run: |
          set -euo pipefail

          # The credential is a file, not a token in the environment.
          if [ -n "${FELDERA_API_KEY:-}" ]; then
            echo "FELDERA_API_KEY was exported" >&2
            exit 1
          fi
          if [ -n "${FELDERA_AUTH_TOKEN_COMMAND:-}" ]; then
            echo "FELDERA_AUTH_TOKEN_COMMAND was exported" >&2
            exit 1
          fi
          if [ -z "${FELDERA_OIDC_TOKEN_FILE:-}" ]; then
            echo "FELDERA_OIDC_TOKEN_FILE was not exported" >&2
            exit 1
          fi

          token=$(cat "$FELDERA_OIDC_TOKEN_FILE")
          if ! printf '%s' "$token" |
            grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
            echo "the token file holds no JWT" >&2
            exit 1
          fi

          # An empty input means GitHub's default audience, the owning org's URL.
          expected="${EXPECTED_AUDIENCE:-https://github.com/${GITHUB_REPOSITORY_OWNER}}"
          decode='import base64,json,sys; p=sys.stdin.read().strip(); p += "=" * (-len(p) % 4); print(json.loads(base64.urlsafe_b64decode(p))["aud"])'
          actual=$(printf '%s' "$token" | cut -d. -f2 | python3 -c "$decode")

          if [ "$actual" != "$expected" ]; then
            echo "aud is '$actual', expected '$expected'" >&2
            exit 1
          fi
          echo "aud=$actual"

          if [ "${FELDERA_OIDC_AUDIENCE-unset}" != "$EXPECTED_AUDIENCE" ]; then
            echo "FELDERA_OIDC_AUDIENCE is '${FELDERA_OIDC_AUDIENCE-unset}', expected '$EXPECTED_AUDIENCE'" >&2
            exit 1
          fi

          # Readable by nobody else, and kept fresh by a live refresher.
          mode=$(stat -c %a "$FELDERA_OIDC_TOKEN_FILE")
          if [ "$mode" != "600" ]; then
            echo "token file mode is $mode, expected 600" >&2
            exit 1
          fi
          if ! pgrep -f "refresh.js" >/dev/null; then
            echo "no refresher is running" >&2
            exit 1
          fi

      - name: The refresher replaces the token it finds
        run: |
          set -euo pipefail
          export FELDERA_OIDC_TOKEN_FILE="$RUNNER_TEMP/refresh-test.jwt"
          export FELDERA_OIDC_AUDIENCE="${{ matrix.audience }}"
          export FELDERA_OIDC_REFRESH_SECONDS=2
          printf 'placeholder' > "$FELDERA_OIDC_TOKEN_FILE"

          node ./refresh.js &
          loop=$!
          sleep 6
          kill "$loop" 2>/dev/null || true

          if ! grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$' "$FELDERA_OIDC_TOKEN_FILE"; then
            echo "the refresher left the placeholder in place" >&2
            exit 1
          fi
          echo "placeholder replaced by a minted token"

      - name: The post step stops the refresher and removes the token
        run: |
          set -euo pipefail
          victim="$RUNNER_TEMP/post-test.jwt"
          printf 'token' > "$victim"
          sleep 300 &
          pid=$!

          STATE_refresherPid="$pid" STATE_tokenFile="$victim" node ./post.js

          sleep 1
          if kill -0 "$pid" 2>/dev/null; then
            echo "the refresher survived the post step" >&2
            kill "$pid"
            exit 1
          fi
          if [ -e "$victim" ]; then
            echo "the token file survived the post step" >&2
            exit 1
          fi
          echo "refresher stopped and token removed"

  verification:
    name: verification (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: instance accepts the token
            status: 200
            expect: pass
          - name: instance rejects the token
            status: 401
            expect: fail
          - name: instance errors
            status: 500
            expect: fail
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # Stands in for a Feldera instance: the action only needs /v0/config to
      # answer, so the status code is what decides the outcome under test.
      - name: Start a stub instance answering ${{ matrix.status }}
        env:
          STUB_STATUS: ${{ matrix.status }}
        run: |
          set -euo pipefail
          cat > stub.py <<'PY'
          import json, os
          from http.server import BaseHTTPRequestHandler, HTTPServer

          STATUS = int(os.environ["STUB_STATUS"])

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *a):
                  pass

              def do_GET(self):
                  if not (self.headers.get("Authorization") or "").startswith("Bearer "):
                      body, status = {"message": "no credential"}, 401
                  elif STATUS == 200:
                      body, status = {"version": "9.9.9", "revision": "stub"}, 200
                  else:
                      body, status = {"message": "stub says no"}, STATUS
                  payload = json.dumps(body).encode()
                  self.send_response(status)
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()
          PY
          python3 stub.py &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:8080/v0/config" -H "Authorization: Bearer x" && break
            sleep 1
          done

      - id: auth
        continue-on-error: true
        uses: ./
        with:
          host: http://127.0.0.1:8080

      - name: The step ${{ matrix.expect }}ed as expected
        env:
          EXPECTED: ${{ matrix.expect }}
          OUTCOME: ${{ steps.auth.outcome }}
        run: |
          set -euo pipefail
          case "$EXPECTED" in
            pass)
              [ "$OUTCOME" = "success" ] || { echo "expected success, got $OUTCOME" >&2; exit 1; }
              [ "${FELDERA_HOST:-}" = "http://127.0.0.1:8080" ] || {
                echo "FELDERA_HOST is '${FELDERA_HOST:-unset}'" >&2; exit 1; }
              ;;
            fail)
              [ "$OUTCOME" = "failure" ] || { echo "expected failure, got $OUTCOME" >&2; exit 1; }
              ;;
          esac
          echo "outcome=$OUTCOME as expected"
