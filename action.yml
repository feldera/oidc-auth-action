name: Feldera OIDC auth
description: >-
  Authenticate to Feldera with this job's GitHub OIDC token. Exports
  FELDERA_HOST and FELDERA_API_KEY, and fails the step if the instance does not
  accept the token, so a missing trust surfaces here rather than mid-run.
author: Feldera
branding:
  icon: shield
  color: blue

inputs:
  host:
    description: >-
      Feldera API URL. Exported as FELDERA_HOST and used to confirm the token is
      accepted. Defaults to FELDERA_HOST from the environment; without either,
      the token is exported but nothing is verified.
    required: false
    default: ""
  audience:
    description: >-
      Audience to request on the token. Leave empty for GitHub's default (the
      owning org's URL). Set it where the trust identifies the workflow by
      audience rather than by a workflow-scoped subject claim.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Request GitHub OIDC token
      shell: bash
      env:
        FELDERA_AUTH_AUDIENCE: ${{ inputs.audience }}
        FELDERA_AUTH_HOST: ${{ inputs.host }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "ERROR: no OIDC token request URL; the job needs permissions: id-token: write" >&2
          exit 1
        fi

        # Without an audience the default `aud` is the owning org's URL, which
        # is what the subject-scoped trusts pin.
        token_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
        if [ -n "$FELDERA_AUTH_AUDIENCE" ]; then
          # Kept to characters that need no URL escaping, so this stays free of
          # jq and python: the job containers are not guaranteed to have either.
          if ! printf '%s' "$FELDERA_AUTH_AUDIENCE" | grep -qE '^[A-Za-z0-9._~:-]+$'; then
            echo "ERROR: audience '$FELDERA_AUTH_AUDIENCE' has characters that need escaping" >&2
            exit 1
          fi
          token_url="${token_url}&audience=${FELDERA_AUTH_AUDIENCE}"
        fi

        response=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$token_url")
        # A JWT is base64url plus dots, so there is no JSON string escaping to
        # undo. Allow whitespace around the colon rather than assuming compact
        # JSON, and confirm the result really is a three-segment token: a
        # partial match here would otherwise sail on as a bogus credential.
        token=$(printf '%s' "$response" | sed -e 's/.*"value"[[:space:]]*:[[:space:]]*"//' -e 's/".*//')
        if ! printf '%s' "$token" | grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
          echo "ERROR: no JWT in GitHub's OIDC response" >&2
          exit 1
        fi

        echo "::add-mask::$token"
        echo "FELDERA_API_KEY=$token" >> "$GITHUB_ENV"
        # Long-running clients re-mint the token themselves rather than let this
        # one expire mid-run, and they need the audience it was issued for.
        echo "FELDERA_OIDC_AUDIENCE=$FELDERA_AUTH_AUDIENCE" >> "$GITHUB_ENV"
        echo "Requested a GitHub OIDC token (aud ${FELDERA_AUTH_AUDIENCE:-default})"

        # The input wins over an inherited FELDERA_HOST so a job can point one
        # step at a different instance without rewriting its env.
        host="${FELDERA_AUTH_HOST:-${FELDERA_HOST:-}}"
        if [ -z "$host" ]; then
          echo "::notice::No host given and FELDERA_HOST is unset, so the token was not verified"
          exit 0
        fi
        host="${host%/}"
        echo "FELDERA_HOST=$host" >> "$GITHUB_ENV"

        # No input for this on purpose. FELDERA_TLS_INSECURE is the variable the
        # Feldera clients already read, so an instance on a self-signed
        # certificate is configured once for the whole job rather than being
        # offered as a per-step option here. Point CURL_CA_BUNDLE at the CA
        # instead wherever that is possible.
        curl_tls=()
        case "${FELDERA_TLS_INSECURE:-}" in
          1 | true | TRUE | yes | YES) curl_tls=(-k) ;;
        esac

        # Spend one request here to prove the instance accepts the token. The
        # alternative is a 401 surfacing from whatever the job does next, which
        # names neither the credential nor the trust that failed to match.
        response=$(curl "${curl_tls[@]}" -sS -w '\n%{http_code}' \
          -H "Authorization: Bearer $token" "$host/v0/config") || {
          echo "ERROR: could not reach $host" >&2
          exit 1
        }
        status=$(printf '%s' "$response" | tail -n1)
        body=$(printf '%s' "$response" | sed '$d')

        if [ "$status" = "401" ] || [ "$status" = "403" ]; then
          echo "ERROR: $host rejected the token (HTTP $status): $body" >&2
          echo "No OIDC trust on that instance matches this workflow's token." >&2
          echo "Compare the trust's issuer, subject and audience against the token;" >&2
          echo "this one carries aud '${FELDERA_AUTH_AUDIENCE:-https://github.com/${GITHUB_REPOSITORY_OWNER}}'." >&2
          exit 1
        fi
        if [ "$status" != "200" ]; then
          echo "ERROR: $host answered HTTP $status: $body" >&2
          exit 1
        fi

        version=$(printf '%s' "$body" | sed -e 's/.*"version"[[:space:]]*:[[:space:]]*"//' -e 's/".*//')
        case "$version" in
          "" | *'{'* | *'"'*) echo "Authenticated to $host" ;;
          *) echo "Authenticated to $host (Feldera $version)" ;;
        esac
