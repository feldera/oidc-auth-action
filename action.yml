name: Feldera OIDC auth
# Marketplace rejects a description of 125 characters or more, so the detail
# about what it exports and when it fails lives in the README instead.
description: >-
  Authenticate to Feldera with the job's GitHub OIDC token: no stored API key,
  and it refreshes as the job runs.
author: Feldera
branding:
  icon: shield
  color: blue

inputs:
  host:
    description: >-
      Feldera API URL. Exported as FELDERA_HOST and used to confirm the token is
      accepted. Defaults to FELDERA_HOST from the environment; without either,
      the credential is wired up but nothing is verified.
    required: false
    default: ""
  audience:
    description: >-
      Audience to request on the token. Leave empty for GitHub's default (the
      owning org's URL). Set it where the trust identifies the workflow by
      audience rather than by a workflow-scoped subject claim.
    required: false
    default: ""

runs:
  using: node24
  main: index.js
  # Removes the token file and stops the refresher even when the job failed or
  # was cancelled, which is the only place a composite action could not reach.
  post: post.js
  post-if: always()
